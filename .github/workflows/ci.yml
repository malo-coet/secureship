name: CI

# Quand se déclenche le pipeline
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ---- Job 1 : tests automatiques ----
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r app/requirements.txt pytest httpx
      - name: Lancer les tests
        run: pytest -q

  # ---- Job 2 : build de l'image + scan de vulnérabilités ----
  build-scan:
    name: Build & scan
    runs-on: ubuntu-latest
    needs: test
    permissions:                 # ← au niveau du JOB, pas du step
      contents: read
      security-events: write     # ← le droit d'écrire dans l'onglet Security
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t secureship:${{ github.sha }} .

      # 1) Scan qui BLOQUE le build
      - name: Scan Trivy (gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureship:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 2) Scan qui RAPPORTE (produit le SARIF, ne bloque pas)
      - name: Scan Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        if: always()             # ← s'exécute même si le gate a échoué
        with:
          image-ref: secureship:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      # 3) UPLOAD du SARIF vers l'onglet Security
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
